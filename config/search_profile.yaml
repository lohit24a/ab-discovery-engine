# Search profile for the A+B Discovery Engine.
#
# STATUS: PROPOSED for operator review (Day 12, checkpoint 1). Every term below is an editable proposal built from the
# eight role families in the implementation guide. Nothing here is a final career preference. Edit freely; the loader
# validates the file and refuses unknown keys, so a typo is an error, not a silent change.
#
# Conventions
#   * Matching is case-insensitive on whole words/phrases of the TITLE (and, when present, saved description text).
#   * strong_aliases: a title containing one is strong evidence of the family.
#   * weak_aliases:   generic titles (for example "business analyst"). They only count when corroborated by a
#                     corroborating term in the title, or by company_context_terms found in the company's own
#                     recorded description. Uncorroborated weak matches are held for review, never auto-approved.
#   * negative_title_terms: titles that look like a different job. They apply a soft penalty (see ranking.yaml);
#                     only the hard exclusions listed under `hard_exclusions` remove a record from the shortlist.
#   * responsibility_signals: used only when a description text exists (manual imports). The database does not
#                     store job descriptions from the automated sources, so these cannot score those records.
#
# Supported YAML subset (so the file can be read without extra packages): nested mappings, lists written either as
# "- item" lines or [a, b, "c d"], quoted or plain strings, numbers, true/false/null, and # comments.

