location:
  onsite_or_hybrid_cities: [Bengaluru, Bangalore, "Bangalore Urban", Bengalooru, Banglore, Bengalore, Bangaluru]
  remote_country: India
  # "India remote" must be stated; plain "Remote" never means India-eligible.
  india_remote_phrases: ["remote india", "india remote", "remote - india", "remote (india)", "india (remote)", "work from anywhere in india", "pan india remote", "remote, india"]
  generic_remote_terms: [remote, "work from home", wfh, anywhere, distributed]
  # A literal worldwide / global-remote statement does include India in its words, but employers often restrict it in
  # practice. plausible = held for review (default); confirmed = treated like an explicit India remote.  OPERATOR DECISION.
  worldwide_remote: plausible
  worldwide_phrases: ["worldwide", "world wide", "global remote", "remote global", "remote, global", "anywhere in the world", "work from anywhere", "any location"]
  # Regions that contain India: remote limited to them is plausible, never confirmed.
  india_inclusive_regions: [apac, "asia pacific", "south asia", asia]
  # What to do with an India city that is not Bengaluru (Pune, Mumbai, ...): needs_review | incompatible.  OPERATOR DECISION.
  other_india_cities: needs_review
  # Extra foreign evidence on top of the built-in list. A foreign-only record is explicitly incompatible; an
  # India-headquartered company can still advertise foreign-only roles, so this judges the POSTING, never the company.
  foreign_markers: ["united states", usa, "u.s.", "us only", "us-based", "north america", uk, "united kingdom", england, london, canada, toronto, germany, berlin, france, paris, ireland, dublin, netherlands, amsterdam, spain, singapore, australia, sydney, "new zealand", japan, tokyo, china, "hong kong", "new york", "san francisco", "bay area", seattle, austin, boston, chicago, "los angeles", denver, atlanta, dallas, houston, miami, emea, europe, latam, "latin america", "north america", americas, brazil, mexico, colombia, argentina, chile, peru, nigeria, kenya, "south africa", egypt, israel, "tel aviv", dubai, uae, "saudi arabia", philippines, manila, indonesia, jakarta, malaysia, "kuala lumpur", vietnam, thailand, pakistan, bangladesh, "sri lanka", poland, romania, serbia, portugal, italy, sweden, norway, denmark, finland, belgium, switzerland, austria, "any state", nationwide, "us time zones", "est time zone", "pst time zone", alabama, alaska, arizona, arkansas, california, colorado, connecticut, delaware, florida, georgia, hawaii, idaho, illinois, indiana, iowa, kansas, kentucky, louisiana, maine, maryland, massachusetts, michigan, minnesota, mississippi, missouri, montana, nebraska, nevada, "new hampshire", "new jersey", "new mexico", "north carolina", "north dakota", ohio, oklahoma, oregon, pennsylvania, "rhode island", "south carolina", "south dakota", tennessee, texas, utah, vermont, virginia, washington, "west virginia", wisconsin, wyoming]

experience:
  early_career_max_years: 3
  senior_min_years: 5
  # Missing experience is UNKNOWN. It is never treated as senior and never as junior.
  unknown_treatment: neutral
  early_career_title_terms: [associate, junior, jr, "entry level", "entry-level", graduate, "new grad", trainee, apprentice, fresher, intern, internship, apm]
  early_career_text_signals: ["0-3 years", "0-2 years", "1+ years", "new graduate", "new grads ok", fresher, "entry level", "work sample", "paid trial", "founder experience"]
  senior_title_terms: [senior, sr, lead, principal, staff, "associate director", avp, "assistant vice president"]
  # PROPOSED hard-exclusion candidates. treatment: soft_penalty (default) | hard_exclude.  OPERATOR DECISION.
  executive_title_terms: ["vice president", vp, director, "head of", "general manager", president, "chief executive", "chief operating", "chief financial", "chief technology", cto, cfo, coo, ceo]
  executive_title_treatment: soft_penalty
  # Internships: flag_only keeps them qualified like any early-career title; needs_review holds them for your decision
  # (an internship may not be the job you want).  OPERATOR DECISION.
  internship_treatment: needs_review
  internship_title_terms: [intern, internship, trainee, apprentice]
  # Mid-level management titles are not senior by themselves. ignore (default) or soft_penalty.  OPERATOR DECISION.
  mid_level_title_terms: ["deputy manager", "assistant manager", "manager"]
  mid_level_title_treatment: ignore
  # An upstream aggregator label (Feashliaa skill_level: entry / mid / senior / intern) is a SOURCE-REPORTED, machine-derived
  # level. use = it adds a soft signal when available; ignore = never used.  OPERATOR DECISION.
  source_reported_level_treatment: use

hard_exclusions:
  # Only these remove a record from the shortlist (the record always stays in SQLite). Insufficient role evidence is NOT
  # an exclusion: such records go to the exploration lane or to low priority.
  incompatible_location: true      # every documented location is foreign-only/non-India, with nothing unknown
  human_verdict_no: true           # a stored verdict of No (verdicts.suppress_rejected must also be true)
  closed_or_not_seen: true         # the existing lifecycle already says the job is not listed
  placeholder_company_label: true  # "DO NOT USE", "Actively Hiring", ...
  non_target_role: true            # the title names an explicitly different job and matches no role family (see role_screening)

