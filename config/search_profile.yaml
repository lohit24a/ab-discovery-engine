  remote_without_country: needs_review
  experience: neutral
  availability: neutral
  weak_alias_without_corroboration: needs_review
  missing_company_evidence: needs_review

verdicts:
  suppress_rejected: true          # a stored No removes the record from normal suggestions (kept in SQLite)
  never_modify_notes: true

shortlist:
  jobs: 20
  companies_only: 5
  exploration_lane: 10             # low-cost review lane for plausible titles without a role family (never qualified)
  # The preview never pads the list: fewer items are shown when fewer qualify.
  allow_fill_with_needs_review: false
